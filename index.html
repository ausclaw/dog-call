<!DOCTYPE html>
<html>
<head>
  <title>dog callin'</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="container">
  <h1>dog callin'</h1>
  <p class="instructions">type the dog's name to call it over!</p>
  <p id="dog"></p> <!-- This will display our quote -->
  <p id="name"></p> <!-- This will display any status messages -->
  <div>
    <input type="text" aria-label="current word" id="typed-value" /> <!-- The textbox for typing -->
    <button id="start">start</button> <!-- To start the game -->
  </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
